# Esto es para que al iniciar la aplicación en local no se conecte a Kafka y no genere errores de conexión, ya que en local no se tiene un servidor de Kafka corriendo. Esto es útil para desarrollo y pruebas locales sin necesidad de tener Kafka instalado y corriendo.
spring.profiles.active=dev

spring.application.name=gestordocumento
# Puerto del servidor
server.port=8080

# Base de Datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/gestor_documental_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tamaño máximo de subida de archivos
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Directorio donde se guardarán físicamente los archivos
storage.location=uploads

# Desactiva el arranque automático de los listeners de Kafka en desarrollo local
#spring.kafka.listener.auto-startup=false

# Configuración del servidor de Kafka (por defecto en local es localhost:9092)
#spring.kafka.bootstrap-servers=localhost:9092

# Serializadores necesarios para que Spring pueda crear el bean KafkaTemplate automáticamente
#spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
#spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer


# Desactiva la auto-configuración de Kafka por completo en este perfil
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration